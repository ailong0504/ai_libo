
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑塞 · 灵魂与成长</title>
    <style>
        body {
            margin: 0;
            padding: 60px 20px;
            background: #f4f0e8;
            color: #3d3933;
            font-family: "Georgia", serif;
            text-align: center;
        }
        h1 { font-size: 36px; letter-spacing: 8px; }
        .subtitle { color: #999; margin-bottom: 60px; }
        .quote {
            max-width: 650px;
            margin: 30px auto;
            padding: 25px;
            border-bottom: 1px solid #d8d0c3;
            font-size: 20px;
            line-height: 2;
        }
        footer { margin-top: 60px; color: #aaa; }
    </style>
</head>
<body>
    <h1>赫尔曼·黑塞</h1>
    <p class="subtitle">Hermann Hesse · 灵魂与成长</p>

    <div class="quote">
        “每个人的生命都是一条通往自己的道路。”
    </div>

    <div class="quote">
        “我只想追寻自己的命运，无论它将我带向何方。”
    </div>

    <div class="quote">
        “鸟儿奋力冲出蛋壳，蛋就是它的世界。”
    </div>

    <div class="quote">
        “没有经历过孤独的人，不会真正懂得自由。”
    </div>

    <div class="quote">
        “你必须尝试不被别人理解，才能真正认识自己。”
    </div>

    <footer>
        —— 在寻找自我的路上 ——
    </footer>
</body>
</html>
